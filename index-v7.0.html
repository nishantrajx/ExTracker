<script>/* ExTracker derivation engine: pure functions, integer paise only. */
(function (root) {
'use strict';
const CARDS = ['NSCC', 'PSCC', 'PUCC'], HH_CARDS = ['NSCC', 'PSCC'];
const TRACKED = ['NSLC', 'NFDL', 'NHDF'];
const BUCKETS = ['RENT', 'TRANSPORT_BILLS', 'FOOD_GROCERY_SHOPPING'];
const CATEGORIES = {
  'Rent': { type: 'HOUSEHOLD', bucket: 'RENT' },
  'Transport': { type: 'HOUSEHOLD', bucket: 'TRANSPORT_BILLS' },
  'Bills': { type: 'HOUSEHOLD', bucket: 'TRANSPORT_BILLS' },
  'Food': { type: 'HOUSEHOLD', bucket: 'FOOD_GROCERY_SHOPPING' },
  'Groceries': { type: 'HOUSEHOLD', bucket: 'FOOD_GROCERY_SHOPPING' },
  'Shopping': { type: 'HOUSEHOLD', bucket: 'FOOD_GROCERY_SHOPPING' },
  'Personal \u2013 Neo': { type: 'PERSONAL', bucket: 'PERSONAL' },
  'Personal \u2013 Presha': { type: 'PERSONAL', bucket: 'PERSONAL' }
};
const OWN = { Neo: ['N811', 'NFPL'], Presha: ['P811', 'PPNB', 'PSLC', 'PUCC'] };
const OBLIGATION_TYPES = ['REIMBURSEMENT', 'PERSONAL_SETTLEMENT', 'PERSONAL_CARD_RESTORATION', 'CROSS_SETTLEMENT'];
const monthOf = d => String(d).slice(0, 7);
const cf = (creditor, funds) => creditor === 'NHDF' ? (funds || 'HOUSEHOLD_POOL') : '';
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);

/* ---- money ---- */
function parseRupees(str) { // "1,234.5" -> 123450 ; null if invalid
  const m = String(str).replace(/[₹,\s]/g, '').match(/^(\d+)(?:\.(\d{1,2}))?$/);
  return m ? parseInt(m[1], 10) * 100 + parseInt((m[2] || '').padEnd(2, '0') || '0', 10) : null;
}
function fmtINR(p) {
  const neg = p < 0, a = Math.abs(p);
  return (neg ? '-' : '') + '\u20B9' + new Intl.NumberFormat('en-IN').format(Math.trunc(a / 100)) + '.' + String(a % 100).padStart(2, '0');
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => iso.slice(8, 10) + '-' + MON[+iso.slice(5, 7) - 1] + '-' + iso.slice(0, 4);

/* ---- transaction derivation ---- */
function bucketOf(cat) { return (CATEGORIES[cat] || {}).bucket || null; }
function fundingAccount(tx) {
  const b = bucketOf(tx.category);
  if (b === 'RENT') return 'NHDF';
  if (b === 'TRANSPORT_BILLS') return 'NFDL';
  if (b !== 'FOOD_GROCERY_SHOPPING') return null;
  const p = tx.payerAccount;
  if (HH_CARDS.includes(p) || (p === 'NHDF' && tx.nhdfMoneySource !== 'NEO_PERSONAL')) return 'NHDF';
  return 'NSLC';
}
const fromNhdfPersonal = tx => tx.payerAccount === 'NHDF' && tx.nhdfMoneySource === 'NEO_PERSONAL';
function person(tx) { return tx.beneficiary || ((CATEGORIES[tx.category] || {}).bucket === 'PERSONAL' ? tx.category.split('\u2013 ')[1] : ''); }

function deriveTx(tx) {
  const out = { bucket: bucketOf(tx.category), funding: null, treatment: 'NO_OBLIGATION', obligation: null, cardCharges: [], errors: [], warnings: [] };
  const cat = CATEGORIES[tx.category], p = tx.payerAccount, amt = tx.amount;
  if (!cat) { out.errors.push('Unknown category'); return out; }
  const mk = (scope, bucket, debtor, creditor, funds, card) => ({ txId: tx.id, month: monthOf(tx.date), scope, bucket, debtor, creditor,
    creditorFunds: cf(creditor, funds), sourceCard: card || '', amount: amt });
  if (cat.type === 'HOUSEHOLD') {

<script>'use strict';
/* Stage 3: backup, export/import, auto-save file, reminders. Overrides save() and vBk() from app.js. */
let meta={},metaReady=false,fh=null,autoMsg='',autoNeed=false,pending=Promise.resolve();
async function checkAuto(){if(!fh){autoNeed=false;return}try{autoNeed=(await fh.queryPermission({mode:'readwrite'}))!=='granted'}catch(e){autoNeed=true}}
const kvGet=async k=>{const d=await idb();return new Promise(ok=>{const g=d.transaction('kv').objectStore('kv').get(k);g.onsuccess=()=>ok(g.result);g.onerror=()=>ok(undefined)})};
const kvPut=async(k,v)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const dl=(name,text,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
const localDate=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const daysSince=i=>i?(Date.now()-new Date(i))/864e5:Infinity;
const lastBk=()=>[meta.lastExport,meta.lastAuto].filter(Boolean).sort().pop();
const hasData=()=>data.transactions.length||data.settlements.length;
async function save(){await saveIDB();autoSave()}
function autoSave(){if(!fh)return;pending=pending.then(async()=>{try{
  if((await fh.queryPermission({mode:'readwrite'}))!=='granted'){autoMsg='Permission Needed: Tap "Re-Enable"';autoNeed=true;hook();if(st.view==='bk')render();return}
  const w=await fh.createWritable();await w.write(E.exportJSON(data));await w.close();meta.lastAuto=new Date().toISOString();autoMsg='Saved '+new Date().toLocaleTimeString();autoNeed=false;await kvPut('meta',meta)}catch(e){autoMsg='Error: '+e.message}
  hook();if(st.view==='bk')render()})}
function hook(){if(!metaReady)return;const l=lastBk(),d=daysSince(l);
 {const lb=q('#lb'),s=l?E.fmtDate(localDate(l)):'';lb.innerHTML='Last Backup: '+(l?s.slice(0,6)+'<span class="yr">'+s.slice(6)+'</span>':'Never');lb.title='Last Backup: '+(l?s:'Never')}
 let b='';if(fh&&autoNeed)b+='<div class="ban">\u26A0 Auto-Save is Paused: The browser needs your permission again, so Changes are NOT being written to your file. <button class="p" onclick="reAuto()">Re-enable Auto-Save</button></div>';
 if(hasData()&&d>7)b+=`<div class="ban">\u26A0 ${l?'Last backup was '+Math.floor(d)+' days ago.':'You have never exported a Backup.'} <button class="p" onclick="doExport()">Export Now</button></div>`;
 q('#ban').innerHTML=b}
async function doExport(){dl('ExTracker-backup-'+localDate(new Date())+'.json',E.exportJSON(data),'application/json');meta.lastExport=new Date().toISOString();await kvPut('meta',meta);hook();if(st.view==='bk')render()}
function exportCsv(k){const H={transactions:['ID','Date','Type','Category','Description','Amount','Payer','Beneficiary','NHDF Source','Notes'],settlements:['ID','Date','Type','Bucket','Debtor','Creditor','Creditor Funds','Receiver','Paid By','Source Card','Pair','Amount','Notes']};
 const r=k==='transactions'?data.transactions.map(t=>[t.id,t.date,t.expenseType,t.category,t.description,plain(t.amount),t.payerAccount,t.beneficiary,t.nhdfMoneySource,t.notes]):data.settlements.map(s=>[s.id,s.date,s.type,s.bucket,s.debtor,s.originalCreditor,s.creditorFunds,s.receiverAccount,s.paidByAccount,s.sourceCard,s.pairId,plain(s.amount),s.notes]);
 dl('ExTracker-'+k+'-'+localDate(new Date())+'.csv',ExMerge.toCsv([H[k],...r]),'text/csv')}
function exportXlsx(){if(typeof XLSX==='undefined')return alert('Excel export needs the SheetJS library from cdnjs. Connect once and reload, or use CSV.');
 const R=p=>p/100,wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(a),n);
 add('Transactions',data.transactions.map(t=>({ID:t.id,Date:t.date,Type:t.expenseType,Category:t.category,Description:t.description,'Amount (INR)':R(t.amount),Payer:t.payerAccount,Beneficiary:t.beneficiary,'NHDF Source':t.nhdfMoneySource,Notes:t.notes})));
 add('Settlements',data.settlements.map(s=>({ID:s.id,Date:s.date,Type:s.type,Bucket:s.bucket,Debtor:s.debtor,Creditor:s.originalCreditor,'Creditor Funds':s.creditorFunds,Receiver:s.receiverAccount,'Paid By':s.paidByAccount,'Source Card':s.sourceCard,Pair:s.pairId,'Amount (INR)':R(s.amount),Notes:s.notes})));
 add('Obligations',E.buildObligations(data).map(o=>({Month:o.month,Kind:o.scope,Bucket:o.bucket,Debtor:o.debtor,Creditor:o.creditor,Funds:o.creditorFunds,'Obligation (INR)':R(o.obligation),'Settled (INR)':R(o.settled),'Outstanding (INR)':R(o.outstanding),Status:o.status})));
