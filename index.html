*{box-sizing:border-box}body{margin:0;overflow-x:clip;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}

main{max-width:1120px;margin:0 auto;padding:14px 14px calc(40px + env(safe-area-inset-bottom,0))}
button,input,select,textarea{font:inherit;color:inherit;min-height:44px;border:1px solid var(--bd);border-radius:10px;background:var(--card);padding:6px 12px;transition:border-color .15s,background .15s,box-shadow .15s}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{cursor:pointer;font-weight:550}button:hover{border-color:var(--ac)}
button.p{background:var(--ac);color:var(--onac);border-color:var(--ac)}button.d{color:var(--bad)}button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
input,select,textarea{width:100%}h2{margin:20px 0 10px;font-size:20px;letter-spacing:-.01em}h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px;margin-top:12px}
.st,.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}

.si{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:9px;background:var(--acs);color:var(--ac);display:grid;place-items:center}

.mut{color:var(--mut);font-size:14px}.sc{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}

td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}label{display:block;font-size:14px;color:var(--mut);margin-bottom:3px;font-weight:550}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .5s ease}.bar i.bad{background:var(--bad)}.bar i.warn{background:var(--warn)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent)}
.SETTLED,.OK,.PASS{color:var(--ok)}.OPEN,.NEGATIVE,.OVER_SETTLED,.FAIL,.err{color:var(--bad)}.PARTIALLY_SETTLED,.wrn{color:var(--warn)}
.ban{background:var(--banbg);color:var(--bantx);border-bottom:1px solid var(--banbd);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}.ban button{min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:8px 0}.row>*{flex:1 1 150px}.acts{display:flex;gap:6px}
/* dashboard */
.bk+.bk{margin-top:16px}.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.bn{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:14px;font-variant-numeric:tabular-nums}
.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.dw{position:relative;width:170px;height:170px;flex:none}.dw svg{width:100%;height:100%;transform:rotate(0deg)}
.dc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.dc b{font-size:14px;font-variant-numeric:tabular-nums}
.lg{list-style:none;margin:0;padding:0;flex:1 1 180px;font-size:14px}.lg li{display:flex;align-items:center;gap:8px;padding:4px 0}.lg li span{flex:1}.lg i{width:10px;height:10px;border-radius:3px;flex:none}.lg b{font-variant-numeric:tabular-nums;font-weight:600}.lg em{color:var(--mut);font-style:normal;width:44px;text-align:right}
.gw{position:relative;max-width:260px;margin:0 auto}.gw svg{width:100%;display:block}.gc{position:absolute;left:0;right:0;bottom:2px;text-align:center}.gc b{font-size:28px;font-weight:650}
.cr+.cr{margin-top:14px}.stk{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--bd)}.stk i{display:block;min-width:0}.stk i+i{border-left:2px solid var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.chips .tag{font-size:13.5px;padding:4px 12px}.chips .tag b{font-variant-numeric:tabular-nums;margin-right:4px}.chips .z{opacity:.45}
.ow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:4px 0;font-size:14px}.ow .bar{height:8px}.ow b{font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}.empty svg{color:var(--ac);margin-bottom:6px}.empty h2{color:var(--tx)}
.filepick{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  min-height:64px;
  padding:8px 18px;
  border:1px solid var(--bd);
  border-radius:10px;
  background:var(--card);
  cursor:pointer;
}

.filepick span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:48px;
  padding:0 24px;
  border-radius:10px;
  background:var(--ac);
  color:var(--onac);
  font-weight:600;
}

.filepick input{
  display:none;
}

input[type=file]{padding:6px}input[type=file]::file-selector-button{min-height:32px;margin-right:12px;border:0;border-radius:8px;background:var(--ac);color:var(--onac);padding:0 14px;font:inherit;font-weight:600;cursor:pointer}

th:first-child,td:first-child{padding-left:14px}th:last-child,td:last-child{padding-right:14px}table.wd{font-size:14px}table.wd th,table.wd td{padding:9px 7px}.wr td:first-child{white-space:normal;min-width:0}.wr td.n{white-space:nowrap}td.em{text-align:centre;padding:28px;color:var(--mut)}.sc.tall{max-height:70vh;overflow:auto}

.cv:not(.tc):not(.k2) td::before{font-weight:450}
.cv:not(.tc):not(.k2) td:first-child{border-top:0;padding-top:10px}
.cv.k1 td:first-child{font-size:16px;padding-bottom:10px}
.cv.tc tr{padding:14px 16px}
.cv.k2 tr{min-height:52px}
}

/* ===== ExTracker UI polish, part 2 ===== */
@media screen{
body{font-family:'Inter ET',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:'cv11' 1,'ss03' 1}
.grid>.st::before{content:"";position:absolute;left:18px;top:0;width:30px;height:4px;border-radius:0 0 4px 4px;background:var(--c1)}
.grid>.st:nth-child(2)::before{background:var(--c2)}
.grid>.st:nth-child(3)::before{background:var(--c3)}
.grid>.st:nth-child(4)::before{background:var(--c4)}
.box>span.OK,.box>span.err{font-weight:700;letter-spacing:.03em;font-size:13px}
summary{color:var(--ac);font-size:14px}
.sc+.box{margin-top:10px;text-align:center}
}
@media screen and (max-width:1139px){
.abar:has(button.p):not(:has([onclick^="fillOpen"])){position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;flex-wrap:nowrap;padding:10px;margin:14px 0 0;border-radius:18px;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--tx) 10%,var(--bd));box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.abar:has(button.p):not(:has([onclick^="fillOpen"])) button{flex:1 1 0;min-width:0}
.abar:has(button.p):not(:has([onclick^="fillOpen"])) .p{flex:2 1 0}
}
@media screen and (max-width:640px){
.cv:not(.tc):not(.k2) td:first-child:is([data-l=Card],[data-l=Payer],[data-l=Bucket],[data-l=Account]){justify-content:flex-start;text-align:left;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--tx);padding:10px 0 12px}
.cv:not(.tc):not(.k2) td:first-child:is([data-l=Card],[data-l=Payer],[data-l=Bucket],[data-l=Account])::before{display:none}
}


/* ===== part 3 ===== */
@media screen{
header{background:transparent;position:sticky}
header::before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--card) 86%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.pr{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 0;font-size:14.5px;font-variant-numeric:tabular-nums}
.pr+.pr{border-top:1px solid color-mix(in srgb,var(--tx) 8%,transparent)}
.pr .tag{margin-left:auto}
}
@media screen and (max-width:640px){
.cv.tc td[data-l=Category],.cv.tc td[data-l=Payer]{padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--tx) 8%,transparent);font-size:12.5px;font-weight:600;color:var(--mut)}
}

<script>/* ExTracker derivation engine: pure functions, integer paise only. */
(function (root) {
'use strict';
const CARDS = ['NSCC', 'PSCC', 'PUCC'], HH_CARDS = ['NSCC', 'PSCC'];
const TRACKED = ['NSLC', 'NFDL', 'NHDF'];
const BUCKETS = ['RENT', 'TRANSPORT_BILLS', 'FOOD_GROCERY_SHOPPING'];
const CATEGORIES = {
  'Rent': { type: 'HOUSEHOLD', bucket: 'RENT' },
  'Transport': { type: 'HOUSEHOLD', bucket: 'TRANSPORT_BILLS' },
  'Bills': { type: 'HOUSEHOLD', bucket: 'TRANSPORT_BILLS' },
  'Food': { type: 'HOUSEHOLD', bucket: 'FOOD_GROCERY_SHOPPING' },
  'Groceries': { type: 'HOUSEHOLD', bucket: 'FOOD_GROCERY_SHOPPING' },
  'Shopping': { type: 'HOUSEHOLD', bucket: 'FOOD_GROCERY_SHOPPING' },
  'Personal \u2013 Neo': { type: 'PERSONAL', bucket: 'PERSONAL' },
  'Personal \u2013 Presha': { type: 'PERSONAL', bucket: 'PERSONAL' }
};
const OWN = { Neo: ['N811', 'NFPL'], Presha: ['P811', 'PPNB', 'PSLC', 'PUCC'] };
const OBLIGATION_TYPES = ['REIMBURSEMENT', 'PERSONAL_SETTLEMENT', 'PERSONAL_CARD_RESTORATION', 'CROSS_SETTLEMENT'];
const monthOf = d => String(d).slice(0, 7);
const cf = (creditor, funds) => creditor === 'NHDF' ? (funds || 'HOUSEHOLD_POOL') : '';
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);

/* ---- money ---- */
function parseRupees(str) { // "1,234.5" -> 123450 ; null if invalid
  const m = String(str).replace(/[₹,\s]/g, '').match(/^(\d+)(?:\.(\d{1,2}))?$/);

}
function fmtINR(p) {
  const neg = p < 0, a = Math.abs(p);
  return (neg ? '-' : '') + '\u20B9' + new Intl.NumberFormat('en-IN').format(Math.trunc(a / 100)) + '.' + String(a % 100).padStart(2, '0');
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => iso.slice(8, 10) + '-' + MON[+iso.slice(5, 7) - 1] + '-' + iso.slice(0, 4);

/* ---- transaction derivation ---- */
function bucketOf(cat) { return (CATEGORIES[cat] || {}).bucket || null; }
function fundingAccount(tx) {
  const b = bucketOf(tx.category);
  if (b === 'RENT') return 'NHDF';
  if (b === 'TRANSPORT_BILLS') return 'NFDL';
  if (b !== 'FOOD_GROCERY_SHOPPING') return null;
  const p = tx.payerAccount;
  if (HH_CARDS.includes(p) || (p === 'NHDF' && tx.nhdfMoneySource !== 'NEO_PERSONAL')) return 'NHDF';

const fromNhdfPersonal = tx => tx.payerAccount === 'NHDF' && tx.nhdfMoneySource === 'NEO_PERSONAL';
function person(tx) { return tx.beneficiary || ((CATEGORIES[tx.category] || {}).bucket === 'PERSONAL' ? tx.category.split('\u2013 ')[1] : ''); }

function deriveTx(tx) {
  const out = { bucket: bucketOf(tx.category), funding: null, treatment: 'NO_OBLIGATION', obligation: null, cardCharges: [], errors: [], warnings: [] };

    creditorFunds: cf(creditor, funds), sourceCard: card || '', amount: amt });
  if (cat.type === 'HOUSEHOLD') {
    out.funding = fundingAccount(tx);
    const isCard = HH_CARDS.includes(p);
    if (cat.bucket === 'RENT' && (isCard || p === 'PUCC')) { out.errors.push('Rent cannot be paid by a credit card'); return out; }
    if (isCard) out.cardCharges.push({ card: p, kind: 'HOUSEHOLD', amount: amt });
    else if (p === 'PUCC') out.cardCharges.push({ card: p, kind: 'HOUSEHOLD', amount: amt });
    if (cat.bucket === 'FOOD_GROCERY_SHOPPING' && isCard) { out.treatment = 'CARD_CHARGE'; return out; }

 const cats=Object.entries(S.byCategory).sort((a,b)=>b[1]-a[1]),tot=cats.reduce((n,c)=>n+c[1],0);let acc=0;

 const donut=tot?`<div class="dn"><div class="dw"><svg viewBox="0 0 42 42" role="img" aria-label="Spending by category"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--bd)" stroke-width="5"/>${seg}</svg><div class="dc"><span class="mut">Total</span><b>${$$(tot)}</b></div></div><ul class="lg">${cats.map(([k,v],i)=>`<li><i style="background:var(--c${i%8+1})"></i><span>${esc(k)}</span><b>${$$(v)}</b><em>${Math.round(v*100/tot)}%</em></li>`).join('')}</ul></div>`:`<p class="mut">No spending this month.</p>`;
 const gp=p?Math.min(100,Math.max(0,p.committedPct)):0,arc='M10 60A50 50 0 0 1 110 60';

 return `<div class="grid">${stat('dash','Household Spend',$$(S.household))}${stat('user','Personal Spend',$$(S.personal),dot('neo','Neo '+$$(S.personalBy.Neo))+' &nbsp; '+dot('pre','Presha '+$$(S.personalBy.Presha)))}${stat('card','Credit Cards',$$(S.cardGross),'Outstanding '+$$(S.cardOutstanding))}${stat('pend','Open Obligations',S.openCount,$$(S.openAmount)+' Outstanding'+(S.overSettledCount?` \u00B7 <span class="err">${S.overSettledCount} over-settled</span>`:''))}</div>
